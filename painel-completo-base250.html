<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Completo Base 250</title>
</head>
<body>
    <h1>Painel Completo Base 250</h1>
    <h2>Funcionalidades</h2>
    <p>Integração de Email, WhatsApp e Recursos de Rescisão de Contrato.</p>

    <h3>Integração de Email</h3>
    <form id="emailForm">
        <label for="email">Endereço de Email:</label>
        <input type="email" id="email" required>
        <button type="submit">Enviar Email</button>
    </form>

    <h3>Integração WhatsApp</h3>
    <a href="https://wa.me/?text=Olá!">Enviar Mensagem pelo WhatsApp</a>

    <h3>Rescisão de Contrato</h3>
    <form id="contractTerminationForm">
        <label for="contractId">ID do Contrato:</label>
        <input type="text" id="contractId" required>
        <button type="submit">Rescindir Contrato</button>
    </form>
</body>
</html>
